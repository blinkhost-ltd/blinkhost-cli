name: Native application test tools
description: Install the Go, Rust and Python tools used by the packaged application test adapters.
runs:
  using: composite
  steps:
    - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
      with:
        go-version: '1.27.3'
        cache: false
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: '1.98.0'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.12.15'
    - name: Enable coverage for the Python adapter tests
      shell: bash
      run: |
        python3 -m venv "$RUNNER_TEMP/blinkhost-cli-python"
        python_bin="$RUNNER_TEMP/blinkhost-cli-python/bin/python"
        "$python_bin" -m pip install --require-hashes --only-binary=:all: --no-deps -r /dev/stdin <<'REQUIREMENTS'
        coverage==7.10.7 --hash=sha256:314f2c326ded3f4b09be11bc282eb2fc861184bc95748ae67b360ac962770be7
        REQUIREMENTS
        echo "BLINKHOST_TEST_PYTHON=$python_bin" >> "$GITHUB_ENV"
        echo "BLINKHOST_TEST_PYTHON_COVERAGE=1" >> "$GITHUB_ENV"
